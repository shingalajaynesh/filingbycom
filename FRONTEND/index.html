<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Favicon -->
  <link rel="icon" href="/logo.jpeg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/logo.jpeg" />
  
  <!-- Primary SEO (defaults — react-helmet-async overrides per page) -->
  <title>FilingBy.com — CA Services Online | GST, Company Registration, Trademark, ITR Filing India</title>
  <meta name="description" content="FilingBy.com is India's trusted CA & compliance platform. Expert-assisted GST registration, company incorporation, trademark, ITR filing, virtual office and 100+ more services — 100% online." />
  <meta name="keywords" content="GST registration, company registration India, trademark registration, ITR filing, CA services online, virtual office India, LLP registration, MSME registration, ROC compliance, accounting services India" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <link rel="canonical" href="https://filingby.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FilingBy.com" />
  <meta property="og:url" content="https://filingby.com/" />
  <meta property="og:title" content="FilingBy.com — CA Services Online | GST, Company Registration India" />
  <meta property="og:description" content="Expert CA-assisted GST registration, company incorporation, trademark, ITR filing and virtual office services — 100% online. Trusted by 50,000+ businesses." />
  <meta property="og:image" content="https://filingby.com/logo.jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@FilingByCom" />
  <meta name="twitter:title" content="FilingBy.com — CA Services Online India" />
  <meta name="twitter:description" content="GST registration, company incorporation, trademark, ITR filing & virtual office — expert-assisted, 100% online." />
  <meta name="twitter:image" content="https://filingby.com/logo.jpeg" />

  <!-- Geo / Regional -->
  <meta name="geo.region" content="IN" />
  <meta name="geo.placename" content="India" />
  <meta name="language" content="English" />
  <meta name="author" content="FilingBy.com" />
  <meta name="theme-color" content="#1A56DB" />
  <meta name="revisit-after" content="7 days" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Global JSON-LD: Organization + WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://filingby.com/#organization",
        "name": "FilingBy.com",
        "url": "https://filingby.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://filingby.com/logo.jpeg",
          "width": 200,
          "height": 60
        },
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "telephone": "+91-75671-26945",
            "contactType": "customer service",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi"]
          }
        ],
        "sameAs": [
          "https://www.linkedin.com/company/filingby",
          "https://twitter.com/FilingByCom",
          "https://www.facebook.com/filingbycom"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://filingby.com/#website",
        "url": "https://filingby.com",
        "name": "FilingBy.com",
        "publisher": {
          "@id": "https://filingby.com/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://filingby.com/services/{search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "inLanguage": "en-IN"
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>

</body>

</html>
